name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    env:
      # Tests and the mock voice relay never call Anthropic or OpenAI. No secrets are used in CI.
      MOCK_AI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Forbidden-word check
        run: npm run check:words

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
